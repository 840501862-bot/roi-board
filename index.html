<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>币安合约 · 高回报率持仓榜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg1:#050814; --bg2:#0a1228; --panel:rgba(16,24,48,.72); --line:#1d2f5e;

  body {
    font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;

  h1 {

  .loading-dots::after { content:""; display:inline-block; width:10px; animation:dots 1.2s infinite steps(4); }
  @keyframes dots { 0%{content:""} 25%{content:"·"} 50%{content:"··"} 75%{content:"···"} }

  .overlay { display:none; position:fixed; inset:0; z-index:10; background:rgba(5,8,20,.75); }
  .overlay.show { display:flex; align-items:center; justify-content:center; }
  .modal {
    width:min(620px,94vw); max-height:86vh; overflow:auto;
    background:linear-gradient(160deg,#101a30,#0c1428); border:1px solid #2a3c6e;
    border-radius:16px; padding:22px 24px; box-shadow:0 20px 60px rgba(0,0,0,.6);

  .modal h3 { font-size:16px; margin-bottom:4px; }
  .modal .m-sub { font-size:12px; color:var(--sub); margin-bottom:14px; }
  .key-row { display:grid; grid-template-columns:96px 1fr 1fr 56px 30px; gap:8px; margin-bottom:10px; align-items:center; }
  .key-row input {
    width:100%; background:#0a1020; border:1px solid var(--line); border-radius:8px;
    color:var(--txt); padding:8px 10px; font-size:12px; font-family:Consolas,monospace; outline:none;
  }
  .key-row input:focus { border-color:var(--blue); }

  .add-btn {

  .countdown.running { color:#22c55e; border-color:#22c55e; box-shadow:0 0 12px rgba(34,197,94,.4); }

<script>
"use strict";
/* ============== 常量 / DOM 引用 ============== */
const FAPI = "https://fapi.binance.com";
const $status   = document.getElementById("status");
const $tbody    = document.getElementById("tbody");
const $net      = document.getElementById("netStatus");
const $cd       = document.getElementById("countdown");
const $autoBtn  = document.getElementById("btnAuto");
const $roiSel   = document.getElementById("roiFilter");

let ROI_MIN = (() => {
  const v = parseFloat(localStorage.getItem("roi_min_v1") || "100");
  return isNaN(v) ? 100 : v;
})();
function saveRoiMin(v){ ROI_MIN = v; try{ localStorage.setItem("roi_min_v1", String(v)); }catch(e){} }

function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* 5倍杠杆账户 ROI 等比换算：实际 7.5% = 正常 100% */
const LEV5_SCALE = 100/7.5;
function scaleRoi(acct, roi){ return (acct && acct.is5x) ? roi*LEV5_SCALE : roi; }

/* ============== SHA-256 / HMAC（纯 JS 兜底） ============== */
function _bytesToHex(b){ return Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join(""); }
function _sha256(data){
  const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const R = (x,n) => (x>>>n)|(x<<(32-n));
  const total = (((data.length+9+63)>>>6)*64)>>>0;
  const by = new Uint8Array(total); by.set(data); by[data.length] = 0x80;
  const bitLen = data.length*8, dv = new DataView(by.buffer);
  dv.setUint32(by.length-4, bitLen>>>0); dv.setUint32(by.length-8, Math.floor(bitLen/0x100000000));
  const w = new Uint32Array(total/4);
  for(let i=0;i<w.length;i++) w[i]=dv.getUint32(i*4);
  const W = new Uint32Array(64);
  for(let block=0; block<w.length; block+=16){
    for(let t=0;t<16;t++) W[t]=w[block+t];
    for(let t=16;t<64;t++){
      const s0 = R(W[t-15],7)^R(W[t-15],18)^(W[t-15]>>>3);
      const s1 = R(W[t-2],17)^R(W[t-2],19)^(W[t-2]>>>10);
      W[t] = (W[t-16]+s0+W[t-7]+s1)>>>0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let t=0;t<64;t++){
      const S1=R(e,6)^R(e,11)^R(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+W[t])>>>0;
      const S0=R(a,2)^R(a,13)^R(a,22), maj=(a&b)^(a&c)^(b&c), t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  const out = new Uint8Array(32), ov = new DataView(out.buffer);
  for(let i=0;i<8;i++) ov.setUint32(i*4, H[i]);
  return out;
}
function _hmac(key, data){
  const BLOCK=64; let k=new Uint8Array(BLOCK);
  if(key.length>BLOCK) key=_sha256(key);
  k.set(key);
  const ipad=new Uint8Array(BLOCK), opad=new Uint8Array(BLOCK);
  for(let i=0;i<BLOCK;i++){ ipad[i]=k[i]^0x36; opad[i]=k[i]^0x5c; }
  const inner=new Uint8Array(BLOCK+data.length); inner.set(ipad); inner.set(data,BLOCK);
  const outer=new Uint8Array(BLOCK+BLOCK); outer.set(opad); outer.set(_sha256(inner),BLOCK);
  return _sha256(outer);
}
async function signQuery(query, secret){
  const msg=new TextEncoder().encode(query), key=new TextEncoder().encode(secret);
  if(window.crypto && crypto.subtle){
    try{
      const ko = await crypto.subtle.importKey("raw", key, {name:"HMAC",hash:"SHA-256"}, false, ["sign"]);
      const sig = await crypto.subtle.sign("HMAC", ko, msg);
      return _bytesToHex(new Uint8Array(sig));
    }catch(e){}
  }
  return _bytesToHex(_hmac(key, msg));
}

/* ============== 时间同步 ============== */
let serverRefMs=0, serverRefPerf=0, syncOk=false;
async function ensureOffset(force){
  if(!force && syncOk && performance.now()-serverRefPerf<60000) return;
  for(const url of [FAPI+"/fapi/v1/time", "https://api.binance.com/api/v3/time"]){
    try{
      const r = await fetch(url, {method:"GET"});
      const d = await r.json();
      const ms = Number(d.serverTime);
      if(ms>0){ serverRefMs=ms; serverRefPerf=performance.now(); syncOk=true; return; }
    }catch(e){}
  }
  syncOk=false;
}
async function nowMs(){
  await ensureOffset();
  return serverRefMs>0 ? Math.round(serverRefMs+(performance.now()-serverRefPerf)) : Date.now();
}

/* ============== 密钥 / 请求 ============== */
function loadKeys(){ try{ return JSON.parse(localStorage.getItem("roi_keys_v1")||"[]"); }catch(e){ return []; } }
function saveKeys(k){ localStorage.setItem("roi_keys_v1", JSON.stringify(k)); }
function acctName(acct, idx){ return acct.name || ("账户"+(idx+1)); }

async function fetchJson(url, opts, timeoutMs=12000){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), timeoutMs);
  try{
    const r = await fetch(url, Object.assign({}, opts, {signal:ctl.signal}));
    return await r.json();
  }finally{ clearTimeout(t); }
}
async function signedFetch(acct, method, path, query, timeoutMs=12000){
  const doFetch = async(q) => {
    const sig = await signQuery(q, acct.api_secret);
    return fetchJson(FAPI+path+"?"+q+"&signature="+sig,
      {method, headers:{"X-MBX-APIKEY":acct.api_key}}, timeoutMs);
  };
  let data = await doFetch(query);
  if(data && data.code!==undefined && (data.code===-1021 || data.code===-1022)){
    // 时间戳偏移/签名无效：强制重新同步服务器时间后重试一次（-1022 通常是本地时间偏差过大导致）
    await ensureOffset(true);
    data = await doFetch(query.replace(/timestamp=\d+/, "timestamp="+(await nowMs())));
  }
  return data;
}
async function apiGetPositions(acct){
  return signedFetch(acct, "GET", "/fapi/v2/positionRisk",
    "timestamp="+(await nowMs())+"&recvWindow=10000");
}

/* ============== 数据处理 ============== */
function positionInfo(p){
  const amt = parseFloat(p.positionAmt)||0;
  const mark = parseFloat(p.markPrice)||0;
  const unrealized = parseFloat(p.unRealizedProfit)||0;
  const lev = parseFloat(p.leverage)||0;
  let margin = parseFloat(p.positionInitialMargin)||parseFloat(p.isolatedMargin)||parseFloat(p.initialMargin)||0;
  if(margin<=0){
    const notional = Math.abs(parseFloat(p.notional)||(amt*mark));
    if(lev>0 && notional>0) margin = notional/lev;
  }
  const roi = margin>0 ? unrealized/margin*100 : 0;
  const notional = Math.abs(amt)*mark;
  return {amt, mark, unrealized, roi, notional, entry: parseFloat(p.entryPrice)||0};
}
function fmtRoi(v){ return (v>=0?"+":"") + v.toFixed(2) + "%"; }
function fmtUsd(v){ return "$" + Math.abs(v).toLocaleString("en-US",{maximumFractionDigits:2}); }

/* ============== exchangeInfo 缓存 ============== */
const RULES_KEY="roi_rules_v1";
let rulesCache=null;
async function getRules(){
  if(rulesCache) return rulesCache;
  try{
    const c = JSON.parse(localStorage.getItem(RULES_KEY)||"null");
    if(c && c.map && Date.now()-c.t < 6*3600*1000){ rulesCache=c.map; return rulesCache; }
  }catch(e){}
  const d = await fetchJson(FAPI+"/fapi/v1/exchangeInfo", {method:"GET"}, 40000);
  const map={};
  for(const s of (d.symbols||[])){
    const f={};
    for(const x of (s.filters||[])) f[x.filterType]=x;
    const lot = f.MARKET_LOT_SIZE || f.LOT_SIZE;
    let step = parseFloat((lot||{}).stepSize)||0;
    if(step<=0) step = Math.pow(10, -(parseInt(s.quantityPrecision,10)||4));
    map[s.symbol] = {
      minNotional: parseFloat((f.MIN_NOTIONAL||{}).notional)||0,
      step,
      minQty: parseFloat((lot||{}).minQty)||0,
      pricePrec: parseInt(s.pricePrecision,10)||2
    };
  }
  rulesCache=map;
  try{ localStorage.setItem(RULES_KEY, JSON.stringify({t:Date.now(), map})); }catch(e){}
  return map;
}

/* ============== 持仓查询 / 下单 / 止损 ============== */
async function postOrderAuto(acct, baseQuery, wantDir){
  const side = wantDir==="long" ? "BUY" : "SELL";
  const cands = wantDir==="long" ? ["LONG","BOTH"] : ["SHORT","BOTH"];
  for(const ps of cands){
    const q = baseQuery + "&side="+side + "&positionSide="+ps +
      "&timestamp="+(await nowMs()) + "&recvWindow=10000";
    const data = await signedFetch(acct, "POST", "/fapi/v1/order", q);
    if(!(data && data.code===-4061)) return data;
  }
  return null;
}
/* 市价加仓（带网络自愈）：请求超时/网络错误时先查持仓确认是否已成交，
   成交了就视为成功（不重复下），没成交才重试；限流/繁忙则退避后重试 */
async function postOrderAutoRobust(acct, sym, dir, qty, preAmt){
  const baseQuery = "symbol="+sym+"&type=MARKET&quantity="+qty+"&newOrderRespType=ACK";
  for(let attempt=0; attempt<4; attempt++){
    let data=null, netErr=null;
    try{ data = await postOrderAuto(acct, baseQuery, dir); }catch(e){ netErr=e; }
    if(data===null){
      throw new Error("加仓失败：positionSide 无法匹配（-4061）");
    }
    if(data && data.code!==undefined){
      if(data.code===-1003 || data.code===-1015 || data.code===-1004){
        await sleep(1500*(attempt+1)); continue;      // 限流/服务繁忙 → 退避重试
      }
      if(data.code===-1021){ await ensureOffset(); await sleep(500); continue; }
      throw new Error("加仓失败 code "+data.code+": "+(data.msg||""));
    }
    if(netErr){
      // 网络/超时：无法确认是否成交 → 查持仓确认，避免重复加仓或漏掉加仓
      await sleep(1000);
      let posNow=null;
      try{ posNow = await getPosition(acct, sym, dir); }catch(e){}
      if(posNow && Math.abs(posNow.amt) >= Math.abs(preAmt)+Math.abs(qty)*0.5){
        return {filled:true, acked:false};             // 其实已成交
      }
      await sleep(1000);
      continue;
    }
    return {filled:true, acked:true};                  // 服务端已确认成交
  }
  throw new Error("加仓请求多次网络超时且无法确认是否成交——请立即在币安确认仓位，若已加仓请手动补设止损");
}
async function getPosition(acct, sym, dir){
  const data = await apiGetPositions(acct);
  if(!Array.isArray(data)) return null;
  const wantLong = dir==="long";
  for(const p of data){
    if(p.symbol!==sym) continue;
    const amt = parseFloat(p.positionAmt)||0;
    if(amt===0) continue;
    if((wantLong && amt>0) || (!wantLong && amt<0)){
      const info = positionInfo(p);
      info.roi = scaleRoi(acct, info.roi);
      return info;
    }
  }
  return null;
}

/* 本地止损单跟踪 */
const SL_KEY="roi_sl_v1";
function loadSL(){ try{ return JSON.parse(localStorage.getItem(SL_KEY)||"[]"); }catch(e){ return []; } }
function saveSL(a){ localStorage.setItem(SL_KEY, JSON.stringify(a)); }
function newClientAlgoId(){ return "sl"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* 止损断点续跑：加仓成交后、止损完成前把任务记录到本地。
   手机端切后台/锁屏/页面被杀导致多轮止损中断时，重开页面会自动补设止损，
   保证“加完仓设止损”最终一定成功。 */
const PEND_KEY="roi_sl_pending_v1";
const PEND_TTL = 30*60*1000;   // 待办任务最长保留 30 分钟：加仓后 30 分钟内补设止损合理；
                               // 超过 30 分钟的任务视为过期（可能已手动处理/仓位已平），自动丢弃，
                               // 避免手机端反复补跑“很久之前”的止损任务卡住页面
function loadPending(){
  try{
    const list = JSON.parse(localStorage.getItem(PEND_KEY)||"[]");
    const now = Date.now();
    const fresh = list.filter(x=> now-(x.ts||0) <= PEND_TTL);
    if(fresh.length!==list.length){
      try{ localStorage.setItem(PEND_KEY, JSON.stringify(fresh)); }catch(e){}
    }
    return fresh;
  }catch(e){ return []; }
}
function savePending(list){ try{ localStorage.setItem(PEND_KEY, JSON.stringify(list)); }catch(e){} }
function upsertPending(t){
  const list = loadPending().filter(x=>!(x.acctIdx===t.acctIdx && x.sym===t.sym && x.dir===t.dir));
  list.push(t);
  savePending(list);
}
function clearPending(acctIdx, sym, dir){
  savePending(loadPending().filter(x=>!(x.acctIdx===acctIdx && x.sym===sym && x.dir===dir)));
}

/* 查询单条条件单：币安 /fapi/v1/algoOrder 必须带 algoId/clientAlgoId（不带则返回 -1102），
   不支持“列出全部”，故只能按本站挂单时保存的 clientAlgoId 逐个查询/确认 */
async function queryAlgo(acct, sym, clientAlgoId){
  if(!clientAlgoId) return null;
  try{
    const d = await signedFetch(acct, "GET", "/fapi/v1/algoOrder",
      "symbol="+sym+"&clientAlgoId="+encodeURIComponent(clientAlgoId)+
      "&timestamp="+(await nowMs())+"&recvWindow=10000");
    if(d && d.code===undefined && d.clientAlgoId) return d;
    return null;
  }catch(e){ return null; }
}

/* ============== 普通止损单（STOP_MARKET + reduceOnly，closePosition=false） ==============
   为什么用普通单而不用 algoOrder(closePosition=true)：
   币安的 -4130 限制（“同方向已有 GTE+closePosition 止损/止盈单”）只针对 closePosition=true 的单；
   且算法单接口不支持“列出全部”（不带 ID 返回 -1102），一旦本地记录丢失就永远撤不掉旧单 → 死锁。
   普通 STOP_MARKET + reduceOnly 不受 -4130 限制、可用 openOrders 列出并按 orderId 精确撤销，
   “加完仓必设止损成功”才有真正的保障。 */
async function openOrdersOf(acct, sym){
  const d = await signedFetch(acct, "GET", "/fapi/v1/openOrders",
    "symbol="+sym+"&timestamp="+(await nowMs())+"&recvWindow=10000");
  return Array.isArray(d) ? d : [];
}
async function cancelOneOrder(acct, sym, orderId){
  const q = "symbol="+sym+"&orderId="+orderId+"&timestamp="+(await nowMs())+"&recvWindow=10000";
  const d = await signedFetch(acct, "DELETE", "/fapi/v1/order", q);
  return !(d && d.code!==undefined);
}
async function queryOrder(acct, sym, clientOrderId){
  try{
    const d = await signedFetch(acct, "GET", "/fapi/v1/order",
      "symbol="+sym+"&origClientOrderId="+encodeURIComponent(clientOrderId)+
      "&timestamp="+(await nowMs())+"&recvWindow=10000");
    if(d && d.code===undefined && d.orderId) return d;
    return null;
  }catch(e){ return null; }
}
/* 查询持仓模式：true=双向(对冲)，false=单向。双向模式下挂平仓单不允许传 reduceOnly（-1106），
   positionSide 用 LONG/SHORT；单向模式必须 positionSide=BOTH + reduceOnly=true（防触发时反向开仓）
   注意：接口返回字段是 dualSidePosition
   缓存：内存 Map + localStorage（roi_dual_v1），避免每次加仓都重复查询、模式查询失败也有兜底值 */
const DUAL_KEY = "roi_dual_v1";
const dualMem = {};
async function apiGetMode(acct){
  const k = acct.api_key;
  if(typeof dualMem[k] === "boolean") return dualMem[k];
  try{
    const c = JSON.parse(localStorage.getItem(DUAL_KEY)||"{}");
    if(typeof c[k] === "boolean"){ dualMem[k]=c[k]; return c[k]; }
  }catch(e){}
  try{
    const d = await signedFetch(acct, "GET", "/fapi/v1/positionSide/dual",
      "timestamp="+(await nowMs())+"&recvWindow=10000");
    const v = !!(d && d.dualSidePosition===true);
    dualMem[k]=v;
    try{
      const c = JSON.parse(localStorage.getItem(DUAL_KEY)||"{}");
      c[k]=v; localStorage.setItem(DUAL_KEY, JSON.stringify(c));
    }catch(e){}
    return v;
  }catch(e){
    return (typeof dualMem[k]==="boolean") ? dualMem[k] : null;
  }
}
async function cancelOneAlgo(acct, sym, algo){
  let idQ = "";
  if(algo && algo.clientAlgoId) idQ = "clientAlgoId="+encodeURIComponent(algo.clientAlgoId);
  else if(algo && algo.algoId != null) idQ = "algoId="+algo.algoId;
  if(!idQ) return false;
  const q = "symbol="+sym+"&"+idQ+"&timestamp="+(await nowMs())+"&recvWindow=10000";
  const d = await signedFetch(acct, "DELETE", "/fapi/v1/algoOrder", q);
  return !(d && d.code!==undefined);
}
/* 列出全部活动算法单（条件单）——币安 Algo Service 的 openAlgoOrders 接口，
   返回数组含 algoId/clientAlgoId/algoType/orderType/symbol/side/positionSide，
   能扫到 App 手动挂的、本站挂的、历史残留的（本地无记录也能自动撤销） */
async function openAlgoOrdersOf(acct){
  try{
    const d = await signedFetch(acct, "GET", "/fapi/v1/openAlgoOrders",
      "timestamp="+(await nowMs())+"&recvWindow=10000");
    return Array.isArray(d) ? d : [];
  }catch(e){ return []; }
}
/* 撤旧止损（普通单 + 服务端条件单 + 本地旧记录，三路全扫）：
   1) openOrders 撤普通 STOP_MARKET 单（含 App 手动挂的普通止损）
   2) openAlgoOrders 撤服务端活动条件单（CONDITIONAL，含 App 手动挂的与历史残留的——
      不需要本地记录，彻底解决“服务端有止损但本地无记录撤不掉”的死锁）
   3) 本地记录的旧版算法单（兼容历史，clientAlgoId 逐条撤）
   每条最多重试 3 次并确认撤销成功；只有确认撤掉的记录才从本地移除，
   失败的记录原样保留（下次加仓/续跑会再撤）——记录与服务端始终一致，绝不误清 */
async function cancelPosSL(acct, sym, dir){
  const all = loadSL();
  const wantSide = dir==="long" ? "SELL" : "BUY";
  const wantPS = dir==="long" ? ["LONG","BOTH"] : ["SHORT","BOTH"];
  let n=0; const okIds=[];
  // 1) 撤普通止损单（openOrders 可见，含 App 手动挂的）
  let open=[], openOk=false;
  try{ open = await openOrdersOf(acct, sym); openOk=true; }catch(e){}
  const targets = (Array.isArray(open)?open:[]).filter(o =>
    String(o.type)==="STOP_MARKET" &&
    String(o.side)===wantSide &&
    (wantPS.indexOf(String(o.positionSide))>=0) &&
    (o.reduceOnly===true || String(o.reduceOnly)==="true"));
  for(const o of targets){
    if(!o.orderId) continue;
    let done=false;
    for(let t=0; t<3 && !done; t++){
      try{ done = await cancelOneOrder(acct, sym, o.orderId); }catch(e){ done=false; }
      if(!done) await sleep(500*(t+1));
    }
    if(done){ n++; okIds.push("o:"+o.orderId); }
  }
  // 2) 撤服务端活动条件单（openAlgoOrders 全量扫描，无需本地记录；
  //    只撤 STOP_MARKET 止损单，不动 App 手动挂的止盈单）
  let algos=[], algoOk=false;
  try{ algos = await openAlgoOrdersOf(acct); algoOk=true; }catch(e){}
  const algoTargets = (Array.isArray(algos)?algos:[]).filter(o =>
    o.symbol===sym &&
    String(o.orderType||o.type)==="STOP_MARKET" &&
    String(o.side)===wantSide &&
    (wantPS.indexOf(String(o.positionSide))>=0));
  for(const o of algoTargets){
    if(!(o.clientAlgoId || o.algoId!=null)) continue;
    let done=false;
    for(let t=0; t<3 && !done; t++){
      try{ done = await cancelOneAlgo(acct, sym, {clientAlgoId:o.clientAlgoId, algoId:o.algoId}); }catch(e){ done=false; }
      if(!done) await sleep(500*(t+1));
    }
    if(done){
      n++;
      okIds.push("a:"+(o.clientAlgoId || String(o.algoId)));
    }
  }
  // 3) 撤旧版算法单（本地记录含 clientAlgoId，兼容历史）
  for(const it of all){
    if(!(it.symbol===sym && it.dir===dir)) continue;
    if(!it.clientAlgoId) continue;
    if(okIds.indexOf("a:"+it.clientAlgoId)>=0) continue;   // 步骤2 已撤掉
    let done=false;
    for(let t=0; t<3 && !done; t++){
      try{ done = await cancelOneAlgo(acct, sym, it); }catch(e){ done=false; }
      if(!done) await sleep(500*(t+1));
    }
    if(done){ n++; okIds.push("a:"+it.clientAlgoId); }
  }
  // 3) 只清确认撤掉的记录；openOrders 查询成功时，orderId 不在 openOrders 的记录
  //    说明该止损单已触发/已撤（服务端已无此单）→ 一并清理防堆积；
  //    openOrders 查询失败时（openOk=false）不清理任何 orderId 记录，保证绝不误清
  if(okIds.length || openOk){
    const openIds = new Set(open.map(o=>String(o.orderId)));
    saveSL(all.filter(x => {
      if(!(x.symbol===sym && x.dir===dir)) return true;
      if(x.orderId){
        if(okIds.indexOf("o:"+x.orderId)>=0) return false;      // 确认撤掉
        if(openOk && !openIds.has(String(x.orderId))) return false; // 服务端已无此单
        return true;
      }
      if(x.clientAlgoId && okIds.indexOf("a:"+x.clientAlgoId)>=0) return false;
      return true;
    }));
  }
  return n;
}

async function setStopLoss(acct, sym, pos, dir){
  const amtAbs = Math.abs(pos.amt);
  if(!(pos.unrealized>0) || amtAbs<=0) throw new Error("当前无浮盈，跳过止损设置");
  const rule = (await getRules())[sym]||{};
  const prec = rule.pricePrec||2;
  const side = pos.amt>0 ? "SELL" : "BUY";
  // 持仓模式：双向(对冲)模式挂平仓单不允许传 reduceOnly（-1106）、positionSide 用 LONG/SHORT；
  // 单向模式必须带 reduceOnly=true + positionSide=BOTH（防触发时反向开仓）
  // 模式有缓存（内存+localStorage）；缓存缺失时先按双向试（账户实测均为双向），遇 -1106 自动切单向
  const dual = await apiGetMode(acct);
  let isDual = (dual===true);
  // 止损数量：当前持仓量向下取整到交易所最小步长（市价加仓后的数量常有碎小数位，
  // 直接下单会报 -1111 精度错误），保证数量合法
  let slQty = amtAbs;
  if(rule.step>0){
    slQty = Math.floor(amtAbs/rule.step)*rule.step;
    slQty = parseFloat(slQty.toFixed(10));
  }
  if(slQty<=0) slQty = amtAbs;               // 极小仓取整为0时保持原值尝试
  // 止损价 = 入场均价 + 当前浮盈的 50%（多单示例）：
  //   多单：入场价 + (现价-入场价)×0.5；空单：入场价 - (入场价-现价)×0.5
  // 止损价永远夹在入场均价与现价之间：无论加仓几次、均价如何被抬高，
  // 每次挂出的止损都严格锁定当前浮盈的一半，绝不会低于入场价（多单）/高于入场价（空单），杜绝“止损即亏损”。
  let stopPrice;
  if(pos.entry>0){
    const profitPerUnit = pos.amt>0 ? (pos.mark-pos.entry) : (pos.entry-pos.mark);
    stopPrice = pos.amt>0 ? (pos.entry+profitPerUnit*0.5) : (pos.entry-profitPerUnit*0.5);
  }else{
    const half = pos.unrealized*0.5/amtAbs;
    stopPrice = pos.amt>0 ? pos.mark-half : pos.mark+half;
  }
  // 【直接设止损·双通道自适应】最多重试 2 次，失败立即抛出弹窗转人工：
  //  通道1 普通 STOP_MARKET（POST /fapi/v1/order）：大多数品种支持（含双向/单向模式适配）；
  //  通道2 算法单 closePosition=true（POST /fapi/v1/algoOrder）：币安对部分品种
  //        （如 CYPHUSDT）已拒绝普通端点挂止损（-4120 “use the Algo Order API”），自动切换；
  //        算法单遇 -4130（同方向已有 closePosition 单）→ 按本地记录撤旧后再挂
  //  - 网络超时/错误：先查服务端该止损是否其实已挂上（有则视为成功），没有才重试
  //  - 限流/繁忙(-1003/-1015/-1004)：等待后重试
  //  - -2021/-4004（触发价距现价过近会立即触发）：把触发价推远 0.5% 重试
  //    （推远后的触发价不允许越过入场价：多单不低于入场价×1.001、空单不高于入场价×0.999）
  const BACKOFF = [600,1200];
  let lastErr = null;
  let placedOrderId = null, placedAlgoId = null;
  for(let attempt=0; attempt<2; attempt++){
    const clientOrderId = "sl"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const triggerPrice = stopPrice.toFixed(prec);
    let outcome = "error";                             // "placed" | "error"
    let needAlgo = false;
    // —— 通道1：普通 STOP_MARKET ——
    for(const ps of (isDual ? (dir==="long" ? ["LONG"] : ["SHORT"]) : ["BOTH"])){
      let data=null, netErr=null;
      try{
        const q = "symbol="+sym+"&side="+side +
          "&type=STOP_MARKET&stopPrice="+triggerPrice +
          "&quantity="+slQty+(isDual?"":"&reduceOnly=true")+"&positionSide="+ps +
          "&timeInForce=GTE_GTC&newClientOrderId="+clientOrderId +
          "&timestamp="+(await nowMs())+"&recvWindow=10000";
        data = await signedFetch(acct, "POST", "/fapi/v1/order", q);
      }catch(e){ netErr=e; }
      if(netErr){
        lastErr = netErr;
        await sleep(600);
        try{
          const placed = await queryOrder(acct, sym, clientOrderId);
          if(placed){ placedOrderId = placed.orderId; outcome = "placed"; }  // 超时但其实已挂上
        }catch(e){}
        break;                                           // 网络错误 → 退避后整轮重试
      }
      if(data && data.code!==undefined){
        lastErr = data;
        if(data.code===-1106 && isDual){                 // 双向姿势被拒（实际为单向）→ 切单向参数
          isDual = false;
          continue;
        }
        if(data.code===-4061){ continue; }               // 换 positionSide
        if(data.code===-1021){ await ensureOffset(true); break; }
        if(data.code===-4120){ needAlgo = true; break; } // 该品种普通端点不支持挂止损 → 切算法单通道
        if(data.code===-2021 || data.code===-4004){      // 触发价太近 → 推远 0.5%（不许越过入场价）
          const buf = pos.mark*0.005;
          if(pos.amt>0){
            const floor = pos.entry>0 ? pos.entry*1.001 : -Infinity;
            stopPrice = Math.max(pos.mark-buf, floor);
          }else{
            const ceil = pos.entry>0 ? pos.entry*0.999 : Infinity;
            stopPrice = Math.min(pos.mark+buf, ceil);
          }
          break;
        }
        break;                                           // 其他错误（限流/繁忙等）→ 退避重试
      }
      if(data && data.orderId){ placedOrderId = data.orderId; outcome = "placed"; break; }
      outcome = "placed";                                // 服务端已返回成功
      break;
    }
    // —— 通道2：普通端点拒绝（-4120）→ 算法单 closePosition=true ——
    if(outcome==="error" && needAlgo){
      for(let a=0; a<2; a++){
        let d=null, nErr=null;
        try{
          // 算法单参数（币安 Algo Service）：algoType=CONDITIONAL 必填（缺失报 -1102），
          // 触发价字段是 triggerPrice（不是 stopPrice），closePosition=true 自带只平仓属性
          const q = "symbol="+sym+"&side="+side+"&algoType=CONDITIONAL&type=STOP_MARKET&triggerPrice="+triggerPrice+
            "&positionSide="+(isDual ? (dir==="long"?"LONG":"SHORT") : "BOTH")+
            "&closePosition=true&timeInForce=GTC&newClientAlgoId="+clientOrderId+
            "&timestamp="+(await nowMs())+"&recvWindow=10000";
          d = await signedFetch(acct, "POST", "/fapi/v1/algoOrder", q);
        }catch(e){ nErr=e; }
        if(nErr){
          lastErr = nErr;
          await sleep(600);
          try{
            const placed = await queryAlgo(acct, sym, clientOrderId);
            if(placed){ placedAlgoId = clientOrderId; outcome = "placed"; }  // 超时但其实已挂上
          }catch(e){}
          break;
        }
        if(d && d.code!==undefined){
          lastErr = d;
          if(d.code===-4130 || /close.?position/i.test(d.msg||"")){
            // 同方向已有 closePosition 条件单：按本地记录撤旧（本站挂的算法单都存了
            // clientAlgoId，可自动撤销）；撤不掉且本地无记录 → 明确提示手动处理
            const cancelled = await cancelPosSL(acct, sym, dir);
            if(cancelled===0){
              const before = loadSL().filter(x=>x.symbol===sym && x.dir===dir);
              if(before.length===0){
                throw new Error("检测到同方向已有旧版止损单残留且本站无记录（币安不允许通过API自动撤销）——请打开币安App→合约→策略委托手动删除该止损单后重新加仓");
              }
            }
            await sleep(500);
            continue;
          }
          if(d.code===-4061){ continue; }
          if(d.code===-1021){ await ensureOffset(true); break; }
          if(d.code===-2021 || d.code===-4004){
            const buf = pos.mark*0.005;
            if(pos.amt>0){
              const floor = pos.entry>0 ? pos.entry*1.001 : -Infinity;
              stopPrice = Math.max(pos.mark-buf, floor);
            }else{
              const ceil = pos.entry>0 ? pos.entry*0.999 : Infinity;
              stopPrice = Math.min(pos.mark+buf, ceil);
            }
            break;
          }
          break;
        }
        if(d && (d.clientAlgoId || d.algoId)){ placedAlgoId = d.clientAlgoId || String(d.algoId); outcome = "placed"; break; }
        outcome = "placed";                              // 服务端已返回成功
        break;
      }
    }
    if(outcome === "placed"){
      const all = loadSL();
      if(placedAlgoId){
        all.push({symbol:sym, dir, clientAlgoId:placedAlgoId, triggerPrice:stopPrice,
          created:new Date().toLocaleString("zh-CN",{hour12:false})});
      }else{
        all.push({symbol:sym, dir, orderId:placedOrderId, clientOrderId, triggerPrice:stopPrice,
          created:new Date().toLocaleString("zh-CN",{hour12:false})});
      }
      saveSL(all);
      return stopPrice;
    }
    if(attempt<1) await sleep(BACKOFF[attempt]);
  }
  if(lastErr){
    if(lastErr && lastErr.code!==undefined) throw new Error("设止损失败 code "+lastErr.code+": "+(lastErr.msg||""));
    throw new Error("设止损失败："+((lastErr&&lastErr.message)||"网络错误")+"（已重试2次）");
  }
  throw new Error("设止损失败（未知错误）");
}

/* ============== 止损保障流程（查持仓 → 撤旧止损 → 挂新止损，多轮重试） ==============
   加仓主流程与断点续跑共用：速度慢也优先保证“止损必须设置成功” */
async function applyStopLoss(acct, name, acctIdx, sym, dir){
  let pos=null, posErr=null;
  for(let t=0; t<3 && !pos; t++){
    try{ pos = await getPosition(acct, sym, dir); }catch(e){ posErr=e; }
    if(!pos) await sleep(800);
  }
  if(!pos){
    if(posErr) throw new Error("持仓查询网络失败（"+posErr.message+"）——请手动确认仓位并设置止损");
    throw new Error("该持仓已平仓，无需设置止损");   // 查询成功但无此仓位 → 任务作废
  }
  // 直接设止损：撤旧止损 → 挂新止损，一次完成，不再多轮循环；
  // 失败立即抛出 → 上层弹窗转人工处理（关闭弹窗才能继续下一个）
  $status.innerHTML = "["+esc(name)+"] "+sym+" 正在设置止损 <span class='loading-dots'></span>";
  await cancelPosSL(acct, sym, dir);            // 撤旧止损（内部校验，撤干净为止）
  const stopPrice = await setStopLoss(acct, sym, pos, dir);  // 直接挂新止损
  return {stopPrice, pos};
}

/* ============== 刷新 ============== */
async function refresh(){
  const accounts = loadKeys().filter(a=>a && a.api_key && a.api_secret);
  if(!accounts.length){
    $status.textContent = "请先「设置账户」填写 API Key / Secret。";
    $tbody.innerHTML = '<tr><td colspan="6" class="empty"><div class="big">未配置账户</div>点「设置账户」添加</td></tr>';
    return;
  }
  $status.innerHTML = "正在加载 <span class='loading-dots'></span>";
  try{
    await ensureOffset();
    const rows=[]; const errs=[];
    // 分批并发拉取账户持仓（每批最多 3 个并行，避免串行拖慢且不触发币安限流）
    const fetched = [];
    for(let i=0; i<accounts.length; i+=3){
      const batch = accounts.slice(i, i+3).map(async (acct, bi)=>{
        const ai = i + bi;
        const name = acctName(acct, ai);
        try{ return {ai, name, acct, data: await apiGetPositions(acct)}; }
        catch(e){ return {ai, name, acct, err: e.message}; }
      });
      fetched.push(...(await Promise.all(batch)));
    }
    for(const r of fetched){
      if(r.err){ errs.push(r.name+": "+r.err); continue; }
      if(!Array.isArray(r.data)){ errs.push(r.name+": 返回格式异常"); continue; }
      for(const p of r.data){
        const amt = parseFloat(p.positionAmt)||0;
        if(amt===0) continue;
        const info = positionInfo(p);
        const roi = scaleRoi(r.acct, info.roi);
        if(roi < ROI_MIN) continue;
        rows.push({acctIdx:r.ai, acctName:r.name, is5x:!!r.acct.is5x, symbol:p.symbol,
                   amt:info.amt, roi:roi, notional:info.notional});
      }
    }
    rows.sort((a,b)=>b.roi-a.roi);
    if(!rows.length){
      $tbody.innerHTML = '<tr><td colspan="6" class="empty"><div class="big">当前没有 ROI ≥ '+ROI_MIN+'% 的持仓</div>刷新后自动更新</td></tr>';
    }else{
      $tbody.innerHTML = rows.map(r=>{
        const sideCls = r.amt>0 ? "side-long":"side-short";
        const sideTxt = r.amt>0 ? "多":"空";
        const dir    = r.amt>0 ? "long":"short";
        return '<tr>'+
          '<td class="acct-name">'+esc(r.acctName)+(r.is5x?' <span style="font-size:10px;background:#7c3aed;color:#fff;padding:1px 5px;border-radius:4px;margin-left:4px">5x</span>':'')+'</td>'+
          '<td class="sym">'+r.symbol+'</td>'+
          '<td class="'+sideCls+'">'+sideTxt+'</td>'+
          '<td class="num">'+fmtUsd(r.notional)+'</td>'+
          '<td class="num roi-pos">'+fmtRoi(r.roi)+'</td>'+
          '<td><button class="add-btn" data-add="'+r.acctIdx+'|'+r.symbol+'|'+dir+'">加仓</button></td>'+
        '</tr>';
      }).join("");
    }
    const t = new Date().toLocaleTimeString("zh-CN",{hour12:false});
    $status.textContent = "已加载 "+accounts.length+" 个账户 · "+rows.length+" 条 ROI≥"+ROI_MIN+"% 持仓 · 更新于 "+t;
    if(errs.length) $status.innerHTML += " · <span style='color:#ef4444'>"+esc(errs.join("；"))+"</span>";
  }catch(e){
    $status.textContent = "加载失败："+e.message;
    $tbody.innerHTML = '<tr><td colspan="6" class="empty"><div class="big">加载失败</div>'+esc(e.message)+'</td></tr>';
  }
}

/* ============== 加仓主流程 ============== */
async function addPos(acctIdx, sym, dir){
  const accounts = loadKeys().filter(a=>a && a.api_key && a.api_secret);
  const acct = accounts[acctIdx];
  if(!acct) throw new Error("无账户");
  const name = acctName(acct, acctIdx);
  $status.innerHTML = "正在加仓 <span class='loading-dots'></span>";
  try{
    await ensureOffset();
    // 1. 实时校验 ROI
    const pre = await getPosition(acct, sym, dir);
    if(!pre) throw new Error("未查到该持仓");
    if(pre.roi < ROI_MIN) throw new Error("投资回报率 "+pre.roi.toFixed(2)+"% < "+ROI_MIN+"%，不满足加仓条件");

    // 2. 计算数量：当前持仓数量的 38%；算出数量太小（低于系统最小开仓要求）
    //    时改用最小加仓数量，保证能正常下单
    const rule = (await getRules())[sym]||{};
    let qty = Math.abs(pre.amt) * 0.38;
    let useMinFallback = false;
    if(rule.step>0){
      qty = Math.floor(qty/rule.step)*rule.step;
      qty = parseFloat(qty.toFixed(10));
    }
    if(qty<=0 || qty*pre.mark < rule.minNotional || (rule.minQty>0 && qty < rule.minQty)){
      // 数量不足时改用最小加仓数量：先按最少开仓金额折算，再向上取整到最小步长/最小数量，
      // 保证不低于交易所要求（向下取整会把低单价币种算出 0 而无法下单）
      qty = (rule.minNotional+1)/pre.mark;
      if(rule.minQty>0 && qty < rule.minQty) qty = rule.minQty;
      if(rule.step>0){
        qty = Math.ceil(qty/rule.step)*rule.step;
        qty = parseFloat(qty.toFixed(10));
      }
      useMinFallback = true;
    }
    if(qty<=0) throw new Error("计算出的加仓数量为 0");

    // 3. 市价加仓（网络超时也会查持仓确认是否已成交，绝不盲目重下）
    $status.innerHTML = "正在市价加仓 "+sym+" <span class='loading-dots'></span>";
    // 记录断点：加仓开始（phase=add）；成交后切到 phase=sl，重开页面可续跑补设止损
    upsertPending({acctIdx, sym, dir, phase:"add", ts:Date.now()});
    const filled = await postOrderAutoRobust(acct, sym, dir, qty, pre.amt);
    if(!filled.filled){
      clearPending(acctIdx, sym, dir);            // 确认未成交，无仓位变化，无需补止损
      throw new Error("加仓未成交（网络异常且持仓无变化）");
    }
    upsertPending({acctIdx, sym, dir, phase:"sl", ts:Date.now()});

    // 4. 【核心保障】加仓已成交 → 直接撤旧止损 → 挂新止损（一次性完成）；
    //    失败立即弹窗转人工处理，关闭弹窗才能继续下一个加仓
    $status.innerHTML = "加仓已成交，正在设置止损 <span class='loading-dots'></span>";
    await sleep(600);
    const sl = await applyStopLoss(acct, name, acctIdx, sym, dir);
    const stopPrice = sl.stopPrice;
    const pos = sl.pos;
    clearPending(acctIdx, sym, dir);

    const note = useMinFallback
      ? "加仓数量低于系统最小要求，按最小加仓数量"+qty
      : "按当前持仓38%加仓"+qty;
    // 执行完止损后立即刷新：不符合加仓条件的持仓马上从列表刷新掉，不留过期行
    const okMsg = "<b style='color:#22c55e'>["+esc(name)+"] "+sym+" "+(dir==="long"?"多":"空")+
      " 加仓成功："+note+" · 新止损"+stopPrice.toFixed(rule.pricePrec||2)+
      "（浮盈"+fmtUsd(pos.unrealized)+"回撤50%即"+fmtUsd(pos.unrealized*0.5)+"触发）</b>";
    try{ await refresh(); }catch(_){}
    $status.innerHTML += " · "+okMsg;
  }catch(e){
    // 已成交但止损未完成（phase=sl）：强制弹窗提示手动设置，关闭弹窗才能继续下一个加仓
    const pend = loadPending().find(x=>x.acctIdx===acctIdx && x.sym===sym && x.dir===dir);
    if(pend && pend.phase==="sl"){
      clearPending(acctIdx, sym, dir);   // 已转人工处理，不再自动续跑
      try{
        window.alert("【止损设置失败，必须手动处理】\n\n["+name+"] "+sym+" 加仓已成交，但自动设置止损失败：\n"+
          e.message+"\n\n请立即打开币安App，手动为 "+sym+" 设置止损！\n（点击确定后继续下一个）");
      }catch(_){}
    }else{
      clearPending(acctIdx, sym, dir);
    }
    const errMsg = "<b style='color:#ef4444'>["+esc(name)+"] "+sym+" 加仓失败："+esc(e.message)+"</b>";
    // 即使中途失败也立即刷新，避免残留过期的加仓行
    try{ await refresh(); }catch(_){}
    $status.innerHTML += " · "+errMsg;
    throw e;
  }
}

$tbody.addEventListener("click", async e=>{
  const btn = e.target.closest("button[data-add]");
  if(!btn || btn.disabled) return;
  btn.disabled = true; btn.textContent = "加仓中…";

    const parts = btn.dataset.add.split("|");
    await addPos(parseInt(parts[0],10), parts[1], parts[2]);

});

/* ============== 自动执行器 ============== */
let autoTimer=null, autoRunning=false, cdTimer=null, nextRoundAt=0;
function startCountdown(seconds){
  stopCountdown();
  nextRoundAt = Date.now()+seconds*1000;
  $cd.style.display = "inline-block";
  $cd.classList.add("running");
  cdTimer = setInterval(()=>{
    const left = Math.max(0, Math.round((nextRoundAt-Date.now())/1000));
    $cd.innerHTML = left + "<small>s</small>";
  }, 200);
}
function stopCountdown(){
  if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
  $cd.style.display = "none";
  $cd.classList.remove("running");
}
async function autoLoop(){
  if(!autoRunning) return;
  try{
    stopCountdown();
    await refresh();
    if(!autoRunning) return;
    const btns = Array.from(document.querySelectorAll("#tbody button[data-add]"));
    if(!btns.length) $status.innerHTML += " · <span style='color:var(--sub)'>本轮无可加仓持仓</span>";
    for(const btn of btns){
      if(!autoRunning) return;
      const parts = btn.dataset.add.split("|");
      const acctIdx = parseInt(parts[0],10), sym=parts[1], dir=parts[2];
      try{
        btn.disabled = true; btn.textContent = "加仓中…";
        $status.innerHTML += " · <span style='color:var(--blue2)'>自动加仓 "+esc(sym)+"…</span>";
        await addPos(acctIdx, sym, dir);
      }catch(e){
        $status.innerHTML += " · <span style='color:#ef4444'>"+esc(sym)+" 跳过："+esc(e.message)+"</span>";
      }
      await new Promise(r=>setTimeout(r,1500));
    }
    if(autoRunning) $status.innerHTML += " · <span style='color:#22c55e'>本轮完成，10s 后下一轮</span>";
  }catch(e){
    $status.innerHTML = "<span style='color:#f5b759'>⚠ 网络中断或接口异常，等待 10s 后自动重试："+esc(e.message)+"</span>";
  }
  if(autoRunning){
    startCountdown(10);
    autoTimer = setTimeout(autoLoop, 10000);
  }
}
$autoBtn.addEventListener("click", ()=>{
  if(autoRunning){
    autoRunning = false;
    if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; }
    stopCountdown();
    $autoBtn.textContent = "▶ 开始自动";
    $autoBtn.style.background = "";
    $status.innerHTML += " · <span style='color:var(--sub)'>已停止自动</span>";
  }else{
    autoRunning = true;
    $autoBtn.textContent = "■ 停止自动";
    $autoBtn.style.background = "linear-gradient(135deg,#a02a2a,#ef4444)";
    autoLoop();
  }
});

/* ============== 网络检测 ============== */
async function pingNet(){
  if(navigator.onLine === false){
    $net.className = "net-ping net-fail"; $net.textContent = "网络连接失败"; return;
  }
  try{
    const ctl = new AbortController();
    const t = setTimeout(()=>ctl.abort(), 5000);
    const r = await fetch(FAPI+"/fapi/v1/ping", {method:"GET", signal:ctl.signal});
    clearTimeout(t);
    if(r.ok){ $net.className = "net-ping net-ok"; $net.textContent = "网络正常"; }
    else throw new Error("http "+r.status);
  }catch(e){
    $net.className = "net-ping net-fail"; $net.textContent = "网络连接失败";
  }
}
pingNet();
setInterval(pingNet, 5000);
window.addEventListener("online", pingNet);
window.addEventListener("offline", ()=>{ $net.className="net-ping net-fail"; $net.textContent="网络连接失败"; });

/* ============== 断点续跑：重开页面自动补设未完成的止损（手机端防杀） ============== */
async function resumePendingSL(){
  const pend = loadPending().filter(x=>x.phase==="sl");
  if(!pend.length) return;
  const accounts = loadKeys().filter(a=>a && a.api_key && a.api_secret);
  for(const t of pend){
    const acct = accounts[t.acctIdx];
    if(!acct) continue;
    const name = acctName(acct, t.acctIdx);
    // 本地已记录该品种止损（止损早已设好/手动处理过）→ 直接清除待办，绝不重复补跑
    const hasLocal = loadSL().some(x=>x.symbol===t.sym && x.dir===t.dir);
    if(hasLocal){ clearPending(t.acctIdx, t.sym, t.dir); continue; }
    $status.innerHTML = "检测到未完成的止损任务 ["+esc(name)+"] "+t.sym+"，正在补设止损 <span class='loading-dots'></span>";
    try{
      const sl = await applyStopLoss(acct, name, t.acctIdx, t.sym, t.dir);
      clearPending(t.acctIdx, t.sym, t.dir);
      $status.innerHTML += " · <b style='color:#22c55e'>["+esc(name)+"] "+t.sym+" 止损已补设 @"+sl.stopPrice.toFixed((await getRules())[t.sym]?.pricePrec||2)+"</b>";
    }catch(e){
      // 仓位已平/无需止损 → 清除待办，不再补跑
      if(/无需|已平仓|不存在/i.test(e.message)){
        clearPending(t.acctIdx, t.sym, t.dir);
        $status.innerHTML += " · <b style='color:#888'>["+esc(name)+"] "+t.sym+" "+esc(e.message)+"（已清理待办）</b>";
      }else{
        $status.innerHTML += " · <b style='color:#ef4444'>["+esc(name)+"] "+t.sym+" 补设止损失败："+esc(e.message)+"（请手动在币安设置止损，待办任务将自动过期）</b>";
      }
      break;   // 一个失败先停下，避免连续全失败
    }
  }
}
